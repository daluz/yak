apiVersion: v1
kind: List
items:
  - apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: gadgets.example.com
    spec:
      group: example.com
      names:
        kind: Gadget
      versions:
        - name: v2
          served: true
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
  - apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: gizmos.example.com
    spec:
      group: example.com
      names:
        kind: Gizmo
      versions:
        - name: v1
          served: true
          schema:
            openAPIV3Schema:
              type: object
              minProperties: 3
              properties:
                spec:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
