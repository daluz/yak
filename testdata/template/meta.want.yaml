# "$filepath" describes the run rather than the document. The path is
# whatever was handed to the tool, which here is the path the tests glob with.
path: ../../testdata/template/meta.yak
note: rendered from ../../testdata/template/meta.yak
# "$yak.version" answers the version the build stamped in, so this golden can
# only say that there is one. internal/eval checks the string itself.
stamped: true
# Rendering is strict unless the run turns it off.
strict: true
