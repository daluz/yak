# Text that every format has to escape or fold carefully. The formats
# agree on what these strings say, which is what the round-trip test
# checks; the goldens record how each one spells them.
trailing-spaces: "a   \nb  \n"
leading-tab: "\tstart\nmid\n"
only-spaces: "   \n   "
lone-newline: "\n"
no-final-newline: |-
  first
  second
blank-line-inside: |
  above

  below
control: "bell:\a escape:\e"
quote-run: a """ b
backslash-end: path\
carriage-return: "a\r\nb"
unicode: "emoji \U0001F389 accent é"
